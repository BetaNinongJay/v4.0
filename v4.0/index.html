<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personalized Career and Job Recommendation</title>
    <meta name="description" content="Find your perfect career match with our AI-powered job recommendation system">
    <meta name="keywords" content="career, job recommendation, career guidance, job matching">
    <meta property="og:title" content="Personalized Career and Job Recommendation">
    <meta property="og:description" content="Find your perfect career match with our AI-powered job recommendation system">
    <meta name="twitter:title" content="Personalized Career and Job Recommendation">
    <meta name="twitter:description" content="Find your perfect career match with our AI-powered job recommendation system">

    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://unpkg.com/lucide-static@0.516.0/font/lucide.css" rel="stylesheet">

    <style type="text/tailwindcss">
    @layer theme {
        :root {
            --primary-color: #2563eb;
            --secondary-color: #dbeafe;
            --success-color: #10b981;
            --warning-color: #f59e0b;
            --text-primary: #1f2937;
            --text-secondary: #6b7280;
            --bg-light: #f9fafb;
            --card-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
    }

    @layer base {
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background-color: var(--bg-light);
            color: var(--text-primary);
        }
    }

    @layer components {
        .btn-primary {
            @apply px-6 py-3 bg-[var(--primary-color)] text-white rounded-xl font-semibold transition-all duration-300 hover:bg-blue-700 hover:shadow-xl transform hover:-translate-y-0.5;
        }
        
        .input-field {
            @apply w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-[var(--primary-color)] focus:border-transparent transition-all bg-white;
        }
        
        .card {
            @apply bg-white rounded-2xl shadow-lg p-6 transition-all duration-300 hover:shadow-xl;
        }
        
        .badge {
            @apply inline-flex items-center px-3 py-1 rounded-full text-xs font-medium;
        }
    }

    @layer utilities {
        .fade-in {
            animation: fadeIn 0.5s ease-in;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel" src="components/Header.js"></script>
    <script type="text/babel" src="components/AboutSection.js"></script>
    <script type="text/babel" src="components/DisclaimerSection.js"></script>
    <script type="text/babel" src="components/InputForm.js"></script>
    <script type="text/babel" src="components/LoadingScreen.js"></script>
    <script type="text/babel" src="components/ResultsPage.js"></script>
    <script type="text/babel" src="utils/mlModel.js"></script>
    <script type="text/babel" src="utils/jobMatcher.js"></script>
    <script type="text/babel" src="app.js"></script>
</body>
</html>
